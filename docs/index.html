<template id="content-origin"><div class="eyebrow">01 / THE ORIGINAL</div><div class="split"><h2>A Japanese original.<br><em>Two American parents.</em></h2><div><p class="lead">Fuji started with a cross in Fujisaki, Aomori, Japan, in 1939: Ralls Janet (Kokko) × Delicious.</p><p>Officially named and registered in 1962, it took its name from its hometown. Today, “Fuji” describes the apple variety; it doesn’t mean the apple in your hand was grown in Japan. <a href="https://www.town.fujisaki.lg.jp/index.cfm/6%2C0%2C13%2C226%2Chtml" target="_blank" rel="noopener">Read the origin story ↗</a></p></div></div><div class="facts"><article><span>THE BITE</span><h3>Big crunch.</h3><p>Dense, crisp flesh with plenty of juice. Made for eating fresh.</p></article><article><span>THE FLAVOR</span><h3>Sweet first.</h3><p>A sweetness-led profile with gentle acidity, rather than a sharp, tart bite.</p></article><article><span>THE LOOK</span><h3>Red on gold.</h3><p>A red-to-pink blush over a yellow-green base; color varies by strain and growing conditions.</p></article></div><a class="source" href="https://waapple.org/varieties/fuji/" target="_blank" rel="noopener">Variety notes: Washington Apple Commission ↗</a></template><template id="content-grown"><div class="eyebrow">02 / ROOTED AROUND THE WORLD</div><div class="section-head"><h2>One variety.<br>Many home grounds.</h2><p>From its birthplace to orchards across both hemispheres. These are selected growing and export regions, not an exhaustive farm directory.</p></div><div class="regions"><article><span class="region-no">01 / JP</span><h3>Japan</h3><p class="region-sub">THE BIRTHPLACE · AOMORI</p><p>Fujisaki is where the variety began. Aomori’s apple-growing history and Fuji’s breeding story are closely connected.</p><a href="https://www.aomori-ringo.or.jp/overview/history/" target="_blank" rel="noopener">Aomori apple history ↗</a></article><article><span class="region-no">02 / US</span><h3>United States</h3><p class="region-sub">WASHINGTON & NEW YORK</p><p>Washington’s Wenatchee Valley growers list Fuji among their varieties. New York also grows Fuji, with its own regional growers and seasonal supply.</p><a href="https://waapple.org/regions/wenatchee-valley/" target="_blank" rel="noopener">Washington growers ↗</a><a href="https://www.applesfromny.com/varieties/fuji/" target="_blank" rel="noopener">New York Fuji ↗</a></article><article><span class="region-no">03 / CN</span><h3>China</h3><p class="region-sub">A MAJOR FUJI PRODUCER</p><p>USDA’s 2024 China fruit report identifies Fuji as the country’s most plentiful apple variety. Production includes fruit for domestic consumption and trade.</p><a href="https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Fresh+Deciduous+Fruit+Annual_Beijing_China+-+People%27s+Republic+of_CH2024-0139" target="_blank" rel="noopener">USDA country report ↗</a></article><article><span class="region-no">04 / CL + ZA</span><h3>South of<br>the equator</h3><p class="region-sub">CHILE & SOUTH AFRICA</p><p>Both export Fuji apples. Their opposite growing season helps extend international supply beyond the Northern Hemisphere harvest.</p><a href="https://www.hortgro.co.za/wp-content/uploads/docs/dlm_uploads/2023/10/SH-Apple-Exports-Week-41-ETA-43-2023.pdf" target="_blank" rel="noopener">Fuji export records ↗</a></article></div><div class="season"><span>THE SEASONAL PICTURE</span><p><strong>Harvest is seasonal. Shopping can be year-round.</strong> Northern and Southern Hemisphere crops, together with refrigerated storage, extend availability. Exact harvest dates and store origins vary by region, season, and supplier.</p></div></template><template id="content-journey"><div class="eyebrow">03 / FOLLOW THE FRUIT</div><div class="section-head"><h2>Orchard.<br>Cold room.<br><em>Your kitchen.</em></h2><p>A typical commercial journey, based on Washington’s packing process. Individual growers, exporters, and retailers may handle fruit differently.</p></div><div class="steps"><article><span>01</span><h3>Grow & pick</h3><p>Apples are picked in the orchard and collected into bins before moving to a packing house.</p></article><article><span>02</span><h3>Check & sort</h3><p>Fruit is washed and inspected. Size, color, shape, internal condition, and maturity help determine its next stop.</p></article><article><span>03</span><h3>Keep it crisp</h3><p>Refrigeration slows ripening. Controlled-atmosphere rooms also manage gases to preserve quality for later sale.</p></article><article><span>04</span><h3>Pack & deliver</h3><p>Apples are packed for distribution to retailers and other buyers. Imported fruit adds an exporter and importer to the journey.</p></article></div><a class="source" href="https://waapple.org/standards/" target="_blank" rel="noopener">Inside the process: Washington Apple Commission ↗</a><aside class="trace"><div><span class="eyebrow">READ THE LABEL</span><h3>Where did <em>your</em><br>Fuji come from?</h3></div><div><p>Start with the country-of-origin sign or packaging. Then look for a grower or packer name and a lot code. If you want the actual orchard, ask the produce department or the named supplier.</p><p>The variety name alone cannot identify a farm, harvest date, or shipping route. A retailer may change suppliers throughout the year.</p><a href="https://www.ams.usda.gov/rules-regulations/cool" target="_blank" rel="noopener">USDA country-of-origin labeling ↗</a></div></aside></template><template id="content-buy"><div class="eyebrow">04 / FIND YOUR NEXT BITE</div><div class="section-head"><h2>Good apples.<br>Within reach.</h2><p>Start with these US retailers or buy through a regional grower. Listings are examples, not live local inventory. Check your store for current availability, price, and origin.</p></div><a class="shop-row" href="https://www.walmart.com/c/kp/fuji-apples" target="_blank" rel="noopener"><span>01</span><h3>Walmart</h3><p>Fresh Fuji apples · individual & bagged</p><b>↗</b></a><a class="shop-row" href="https://www.kroger.com/q/fuji%2Bapples" target="_blank" rel="noopener"><span>02</span><h3>Kroger</h3><p>Conventional & organic Fuji listings</p><b>↗</b></a><a class="shop-row" href="https://www.applesfromny.com/varieties/fuji/" target="_blank" rel="noopener"><span>03</span><h3>Go regional</h3><p>Explore New York’s Fuji grower guide</p><b>↗</b></a><div class="buy-note"><strong>Buying in another country?</strong> Look for Fuji at supermarkets, produce shops, and orchard markets. Verify the country of origin on that specific batch; this guide does not imply every origin is available in every market.</div></template><template id="content-care"><div class="eyebrow">05 / MAKE THE MOST OF IT</div><h2>Pick well.<br><em>Crunch happily.</em></h2><div class="facts"><article><h3>Choose firm fruit.</h3><p>Look for apples without bruises or decay. Natural surface markings alone don’t make a bad apple.</p></article><article><h3>Keep it chilled.</h3><p>Refrigerate apples to help preserve their crisp texture. Check stored fruit regularly and use damaged apples promptly.</p></article><article><h3>Enjoy the sweetness.</h3><p>Eat fresh, slice into salads, or cook into applesauce. Fuji’s naturally sweet character suits simple preparations.</p></article></div><p class="source">Further reading: <a href="https://fruitsfromchile.com/fruit/apples/" target="_blank" rel="noopener">Fruits from Chile ↗</a> · <a href="https://www.applesfromny.com/varieties/fuji/" target="_blank" rel="noopener">New York Apple Association ↗</a></p></template></body></html>
